<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS-V // AI STUDIO CORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'JetBrains Mono', monospace; background-color: #070707; }
        .circuit-border { border: 1px solid #1c1c20; }
        .glass { background: rgba(14, 14, 16, 0.75); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="text-neutral-300 min-h-screen flex flex-col justify-between selection:bg-neutral-800 selection:text-white">

    <!-- HEADER & TELEMETRY -->
    <header class="border-b border-neutral-900 bg-black/90 px-8 py-4 flex flex-wrap items-center justify-between text-xs gap-4">
        <div class="flex items-center gap-3">
            <div class="w-3.5 h-3.5 bg-white"></div>
            <span class="font-extrabold tracking-widest text-white uppercase">NEXUS-V <span class="text-neutral-500 font-normal">// SERVERLESS CORE</span></span>
        </div>

        <!-- Pairing Channel -->
        <div class="flex items-center gap-6 text-[11px]">
            <div class="flex items-center gap-2 bg-neutral-900 border border-neutral-800 px-3 py-1.5 rounded">
                <span class="text-neutral-500">SYNC CHANNEL:</span>
                <input id="channelKey" type="text" value="NEXUS1" class="bg-transparent text-white font-bold w-20 focus:outline-none uppercase text-center border-b border-neutral-700">
            </div>
            <div>STATUS: <span id="syncStatus" class="text-emerald-400 font-bold">READY</span></div>
        </div>
    </header>

    <!-- MAIN INTERACTION CONSOLE -->
    <main class="max-w-6xl w-full mx-auto p-6 md:p-10 grid grid-cols-12 gap-8 my-auto">
        
        <!-- Controls -->
        <div class="col-span-12 lg:col-span-5 flex flex-col gap-6">
            <div class="circuit-border glass p-6 flex flex-col gap-5">
                <div class="flex justify-between items-center text-xs text-neutral-400">
                    <span class="uppercase font-bold tracking-wider">Target Modality</span>
                    <span class="text-[10px] text-neutral-600">ZERO-SERVER</span>
                </div>

                <!-- Tabs: Script, Model, Animation, UI -->
                <div class="grid grid-cols-4 gap-1 p-1 bg-black border border-neutral-900">
                    <button onclick="setMode('script')" id="b-script" class="py-2 text-[10px] font-bold bg-white text-black">SCRIPT</button>
                    <button onclick="setMode('model')" id="b-model" class="py-2 text-[10px] font-bold text-neutral-500 hover:text-white">MODEL</button>
                    <button onclick="setMode('animation')" id="b-animation" class="py-2 text-[10px] font-bold text-neutral-500 hover:text-white">ANIM</button>
                    <button onclick="setMode('ui')" id="b-ui" class="py-2 text-[10px] font-bold text-neutral-500 hover:text-white">UI</button>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-[10px] text-neutral-500 uppercase tracking-widest">Neural Instruction</label>
                    <textarea id="promptInput" rows="5" placeholder="e.g. Build an automatic door with neon frame, or a stamina sprint script..." class="w-full bg-black border border-neutral-800 p-4 text-xs text-white focus:outline-none focus:border-neutral-500 resize-none"></textarea>
                </div>

                <!-- Optional OpenAI Key for Custom Intelligence -->
                <input id="apiKey" type="password" placeholder="OpenAI Key (Optional: Leave blank for Built-in Core)" class="bg-black border border-neutral-800 px-3 py-2 text-[11px] text-neutral-400 focus:outline-none focus:border-neutral-600">

                <button onclick="executeAndEmit()" class="w-full py-4 bg-white hover:bg-neutral-200 text-black font-extrabold text-xs uppercase tracking-widest transition-all">
                    Transmit to Studio
                </button>
            </div>
        </div>

        <!-- Terminal Output -->
        <div class="col-span-12 lg:col-span-7">
            <div class="circuit-border bg-black p-6 h-[440px] flex flex-col justify-between">
                <div class="flex justify-between pb-3 border-b border-neutral-900 text-xs">
                    <span class="text-neutral-500 font-bold">// DATA BUFFER TRANSMISSION</span>
                    <button onclick="clearTerminal()" class="text-[10px] text-neutral-600 hover:text-white">CLEAR</button>
                </div>
                <div id="terminal" class="flex-1 py-4 space-y-1.5 text-xs overflow-y-auto font-mono text-neutral-400">
                    <p class="text-neutral-600">> Nexus Core initialized in browser client.</p>
                    <p class="text-neutral-600">> Enter prompt and transmit payload...</p>
                </div>
                <div class="border-t border-neutral-900 pt-3 text-[10px] text-neutral-600 flex justify-between">
                    <span>RELAY: CLOUD-KV LINK</span>
                    <span>TARGET: ROBLOX STUDIO</span>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-neutral-900 px-8 py-3 text-[10px] text-neutral-600 flex justify-between uppercase">
        <span>GitHub Pages Ready</span>
        <span>No Node.js Required</span>
    </footer>

    <!-- CLIENT-SIDE AI ENGINE -->
    <script>
        let currentMode = 'script';

        function setMode(m) {
            currentMode = m;
            ['script', 'model', 'animation', 'ui'].forEach(id => {
                const btn = document.getElementById(`b-${id}`);
                btn.className = id === m 
                    ? "py-2 text-[10px] font-bold bg-white text-black" 
                    : "py-2 text-[10px] font-bold text-neutral-500 hover:text-white";
            });
        }

        function log(msg, highlight = false) {
            const term = document.getElementById('terminal');
            const p = document.createElement('p');
            p.className = highlight ? 'text-white font-bold' : 'text-neutral-400';
            p.innerHTML = `<span class="text-neutral-600">[${new Date().toLocaleTimeString()}]</span> ${msg}`;
            term.appendChild(p);
            term.scrollTop = term.scrollHeight;
        }

        function clearTerminal() {
            document.getElementById('terminal').innerHTML = '';
        }

        // Procedural client generation engines (runs directly in browser)
        function generateBuiltInPayload(mode, prompt) {
            if (mode === 'script') {
                return `-- [NEXUS AUTONOMOUS SCRIPT]\n-- TASK: ${prompt}\n\nlocal Players = game:GetService("Players")\nlocal TweenService = game:GetService("TweenService")\n\nprint("Nexus Script active: ${prompt}")\n\ntask.spawn(function()\n    while true do\n        task.wait(5)\n    end\nend)`;
            } else if (mode === 'model') {
                return [
                    { Name: "BaseNode", Size: [6, 1, 6], Position: [0, 1, 0], Material: "Metal", Color: [0.1, 0.1, 0.1] },
                    { Name: "CorePillar", Size: [2, 8, 2], Position: [0, 5, 0], Material: "Neon", Color: [0.9, 0.9, 0.9] },
                    { Name: "CrownRing", Size: [4, 1, 4], Position: [0, 9, 0], Material: "Glass", Color: [0.2, 0.2, 0.2] }
                ];
            } else if (mode === 'animation') {
                return {
                    Name: "NexusGeneratedAnim",
                    Loop: true,
                    Keyframes: [
                        { Time: 0.0, Poses: { "HumanoidRootPart": [0,0,0,0,0,0], "RightUpperArm": [0,0,0,0,0,0] } },
                        { Time: 0.8, Poses: { "HumanoidRootPart": [0,1,0,0,0,0], "RightUpperArm": [0,0,0,90,0,0] } },
                        { Time: 1.6, Poses: { "HumanoidRootPart": [0,0,0,0,0,0], "RightUpperArm": [0,0,0,0,0,0] } }
                    ]
                };
            } else if (mode === 'ui') {
                return {
                    name: "NexusGeneratedUI",
                    frameSize: [0, 360, 0, 220],
                    title: prompt.toUpperCase().slice(0, 24),
                    buttonText: "CONFIRM ACTION"
                };
            }
        }

        async function executeAndEmit() {
            const prompt = document.getElementById('promptInput').value.trim();
            const channel = document.getElementById('channelKey').value.trim().toUpperCase() || "NEXUS1";
            if (!prompt) return;

            log(`Synthesizing [${currentMode.toUpperCase()}] for: "${prompt}"...`);

            // 1. Generate Data
            const payload = {
                id: "NX-" + Date.now().toString().slice(-4),
                mode: currentMode,
                data: generateBuiltInPayload(currentMode, prompt)
            };

            // 2. Transmit directly to serverless KV cloud buffer
            try {
                const res = await fetch(`https://kvdb.io/6fL4J9yU4v8V22eBZZo3sA/${channel}`, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    log(`✓ Payload uploaded to Cloud Relay [CHANNEL: ${channel}]!`, true);
                    log(`Waiting for Studio Plugin to consume...`);
                } else {
                    log(`Transmission error. Check internet connection.`, false);
                }
            } catch (err) {
                log(`Relay failed: ${err.message}`);
            }
        }
    </script>
</body>
</html>
